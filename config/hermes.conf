# Local inference host. Nothing here applies unless `hostname -s` matches
# `host` below: model weights are ~17.5GB and the eviction hook assumes an
# Actions runner, so this must never fire on a work Mac or a VM.
host=workhorse

# Served model. Qwen3-30B-A3B is MoE — 30B total, 3.3B active — so it is both
# larger and ~2x faster than a dense 14B. The 2507 refresh is REQUIRED: the
# original tops out at 40960 context and Hermes Agent hard-requires 64000.
# 2507 is also the Instruct (non-thinking) variant, so no reasoning-pass tax.
# Identifiers are LM Studio catalog names, NOT HuggingFace repo ids.
model=qwen/qwen3-30b-a3b-2507
model_fallback=qwen/qwen3-30b-a3b

# Hermes Agent hard-requires >=64k (MINIMUM_CONTEXT_LENGTH in model_metadata.py).
# Set LM Studio's global defaultContextLength to match, or a JIT reload after an
# eviction silently restores the model at 8192 and Hermes then refuses to run.
# KV quantization is NOT exposed by the lms CLI, so this is unquantized.
context=64000

# Single user: 1 concurrent prediction. This is NOT cosmetic — LM Studio reserves
# a KV slot per parallel slot, so parallel=4 cost 22.1GiB vs 16.0GiB at 1.
# The extra 6GiB left only ~5GB of GPU headroom under the ~27GB default
# iogpu ceiling, and the machine took an IOGPUGroupMemory kernel panic
# (2026-09-01, triggered by another GPU client) while sitting there.
parallel=1
ttl_seconds=900

# Unload the model before each CI job. Measured 2026-09-01: 2507 loads in 5.8s,
# so eviction costs ~2% of a 5.5min build. It resides at 22.1GiB at 64k context,
# which against a ~5.8GB build peak leaves no comfortable margin on 36GB.
# Cheap to undo, tight if we don't.
evict_on_ci=true
